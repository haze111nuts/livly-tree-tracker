<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Tree Checklist · Livly Tree Tracker</title>
  <script>
    // Fresh ?v= each load so the browser never shows an old saved copy.
    window.LIVLY_BUILD = Date.now();
    document.write('<link rel="stylesheet" href="css/style.css?v=' + LIVLY_BUILD + '">');
    document.write('<link rel="stylesheet" href="css/tree-checklist.css?v=' + LIVLY_BUILD + '">');
  </script>
</head>
<body>
  <!-- Top bar: app name, page tabs, language (filled in by scripts/nav.js) -->
  <nav id="site-nav" class="site-nav"></nav>

  <header class="page-header">
    <p class="page-meta" id="intro"></p>
  </header>

  <main class="picker-layout">
    <section class="picker-main">
      <div class="picker-toolbar">
        <!-- Which saved account is being edited -->
        <label class="account-picker"><span id="account-label"></span> <select id="account-select"></select></label>
        <input id="search" type="search" autocomplete="off">
        <label class="toggle"><input id="selected-only" type="checkbox"> <span id="selected-only-label"></span></label>
        <button id="reset" type="button" class="btn"></button>
      </div>
      <div id="tree-grid" class="picker-grid"></div>
      <p id="no-results" class="no-results" hidden></p>
    </section>

    <!-- Summary of the account being edited (filled in by scripts/tree-checklist.js) -->
    <aside id="account-panel" class="picker-output"></aside>
  </main>

  <script>
    [
      "data/livlies.js",
      "data/trees.js",
      "scripts/i18n.js",
      "scripts/store.js",
      "scripts/dialog.js",
      "scripts/nav.js",
      "scripts/tree-checklist.js"
    ].forEach(function (src) {
      document.write('<script src="' + src + '?v=' + LIVLY_BUILD + '"><\/script>');
    });
  </script>
</body>
</html>
